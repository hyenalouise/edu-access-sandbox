version: 1

# Final names for the known source-aligned Bronze and Silver objects. A listed
# SQL file is the name to use when that layer is implemented; it does not imply
# that the file already exists. A Silver candidate table holds a build that is
# not yet published: the build writes it, the gate checks it, and only a build
# that passes is copied to the Silver table (D-025).
source_tables:
  - source_id: deped_enrollment
    dataset: DepEd enrollment
    scope:
      school_years: [2020-21, 2021-22, 2022-23, 2023-24, 2024-25, 2025-26]
      note: All six deliveries share one table and are distinguished by school_year.
    bronze:
      table: deped_enrollment_raw
      create_file: 01_create_deped_enrollment_raw.sql
      validate_file: 90_validate_deped_enrollment_raw.sql
    silver:
      table: deped_enrollment_clean
      quarantine_table: deped_enrollment_quarantine
      candidate_table: deped_enrollment_clean_candidate
      candidate_quarantine_table: deped_enrollment_quarantine_candidate
      clean_file: 01_clean_deped_enrollment.sql
      validate_file: 90_validate_deped_enrollment_clean.sql

  - source_id: deped_facilities
    dataset: DepEd facilities
    scope:
      school_years: [2023-24]
    bronze:
      table: deped_facilities_raw
      create_file: 02_create_deped_facilities_raw.sql
      validate_file: 90_validate_deped_facilities_raw.sql
    silver:
      table: deped_facilities_clean
      quarantine_table: deped_facilities_quarantine
      candidate_table: deped_facilities_clean_candidate
      candidate_quarantine_table: deped_facilities_quarantine_candidate
      clean_file: 02_clean_deped_facilities.sql
      validate_file: 90_validate_deped_facilities_clean.sql

  - source_id: deped_personnel
    dataset: DepEd personnel
    scope:
      school_years: [2023-24]
    bronze:
      table: deped_personnel_raw
      create_file: 03_create_deped_personnel_raw.sql
      validate_file: 90_validate_deped_personnel_raw.sql
    silver:
      table: deped_personnel_clean
      quarantine_table: deped_personnel_quarantine
      candidate_table: deped_personnel_clean_candidate
      candidate_quarantine_table: deped_personnel_quarantine_candidate
      clean_file: 03_clean_deped_personnel.sql
      validate_file: 90_validate_deped_personnel_clean.sql

  - source_id: psa_psgc
    dataset: Philippine Standard Geographic Code (PSGC)
    scope:
      workbook: PSGC xlsx
      sheet: PSGC
      note: The workbook and its PSGC sheet are one logical source table, not two datasets.
    bronze:
      table: psa_psgc_raw
      create_file: 04_create_psa_psgc_raw.sql
      validate_file: 90_validate_psa_psgc_raw.sql
    silver:
      table: psa_psgc_clean
      quarantine_table: psa_psgc_quarantine
      candidate_table: psa_psgc_clean_candidate
      candidate_quarantine_table: psa_psgc_quarantine_candidate
      clean_file: 04_clean_psa_psgc.sql
      validate_file: 90_validate_psa_psgc_clean.sql

  - source_id: psa_poverty_stat
    dataset: PSA poverty statistics
    scope:
      estimate_years: [2018, 2021, 2023]
    bronze:
      table: psa_poverty_stat_raw
      create_file: 05_create_psa_poverty_stat_raw.sql
      validate_file: 90_validate_psa_poverty_stat_raw.sql
    silver:
      table: psa_poverty_stat_clean
      quarantine_table: psa_poverty_stat_quarantine
      candidate_table: psa_poverty_stat_clean_candidate
      candidate_quarantine_table: psa_poverty_stat_quarantine_candidate
      clean_file: 05_clean_psa_poverty_stat.sql
      validate_file: 90_validate_psa_poverty_stat_clean.sql

  - source_id: hdx_boundaries
    dataset: HDX administrative boundaries
    scope:
      layer: ADM3
      note: Only ADM3 is in the current analytical scope; the table name makes that grain explicit.
    bronze:
      table: hdx_adm3_raw
      create_file: 06_create_hdx_adm3_raw.sql
      validate_file: 90_validate_hdx_adm3_raw.sql
    silver:
      table: hdx_adm3_clean
      quarantine_table: hdx_adm3_quarantine
      candidate_table: hdx_adm3_clean_candidate
      candidate_quarantine_table: hdx_adm3_quarantine_candidate
      clean_file: 06_clean_hdx_adm3.sql
      validate_file: 90_validate_hdx_adm3_clean.sql

  - source_id: deped_enrollment_psgc
    dataset: DepEd EMISD enrollment with PSGC and coordinates
    scope:
      school_years: [2023-24]
      workbook: EMISD xlsx
      sheet: DB
      note: >-
        Loaded for its PSGC codes and coordinates, not its counts (D-049). Silver is the
        school_id to PSGC crosswalk, one row per school (#163).
    bronze:
      table: deped_enrollment_psgc_raw
      create_file: 07_create_deped_enrollment_psgc_raw.sql
      validate_file: 90_validate_deped_enrollment_psgc_raw.sql
    silver:
      table: deped_enrollment_psgc_clean
      quarantine_table: deped_enrollment_psgc_quarantine
      candidate_table: deped_enrollment_psgc_clean_candidate
      candidate_quarantine_table: deped_enrollment_psgc_quarantine_candidate
      clean_file: 07_clean_deped_enrollment_psgc.sql
      validate_file: 90_validate_deped_enrollment_psgc_clean.sql

  - source_id: psa_school_age_population
    dataset: PSA school-age population by single-year age, sex and city/municipality
    scope:
      census_years: [2020, 2024]
      workbook: one xlsx per census
      sheets: ["<year> Total Pop", "<year> Household Pop"]
      note: >-
        Both sheets of each workbook are one logical source table; a row is identified by its sheet too (#157).
        Bronze is live (#157), and Silver (#158): one row per count cell, with each place's level and parent from the sums (D-053).
    bronze:
      table: psa_school_age_population_raw
      create_file: 08_create_psa_school_age_population_raw.sql
      validate_file: 90_validate_psa_school_age_population_raw.sql
    silver:
      table: psa_school_age_population_clean
      quarantine_table: psa_school_age_population_quarantine
      candidate_table: psa_school_age_population_clean_candidate
      candidate_quarantine_table: psa_school_age_population_quarantine_candidate
      clean_file: 08_clean_psa_school_age_population.sql
      validate_file: 90_validate_psa_school_age_population_clean.sql

# Candidates only. Keep them out of executable ETL until their keys, review
# workflow, and grains are approved.
draft_integration_tables:
  - table: hdx_adm3_psgc_map
    candidate_file: 03_map_hdx_adm3_psgc.sql
    purpose: Reviewed mapping from HDX ADM3 features to PSGC cities and municipalities.

integration_tables:
  - table: deped_annex_mother_map
    build_file: 04_map_deped_annex_mother.sql
    validate_file: 90_validate_deped_annex_mother_map.sql
    grain: One row per annex school and school year.
    purpose: Auditable annex-to-mother mapping. Rows remain unmatched until DepEd publishes a reliable crosswalk.
  - table: psa_poverty_psgc_map
    build_file: 02_map_psa_poverty_psgc.sql
    validate_file: 90_validate_psa_poverty_psgc_map.sql
    grain: One row per psa_poverty_stat_clean row (psgc_id, estimate_year).
    purpose: PSA poverty estimates matched to PSGC by Correspondence Code only, estimates carried unchanged (D-054).
  - table: psa_school_age_population_psgc_map
    build_file: 05_map_psa_school_age_population_psgc.sql
    validate_file: 90_validate_psa_school_age_population_psgc_map.sql
    grain: One row per census year and city or municipality of psa_school_age_population_clean (census_year, place_name, parent_name).
    purpose: PSA school-age population places matched to PSGC by name inside a reviewed parent, overrides in config (D-055).
  - table: deped_school_psgc_map
    build_file: 01_map_deped_school_psgc.sql
    validate_file: 90_validate_deped_school_psgc_map.sql
    grain: One row per enrollment school_id, school_year, and geographic_level (city_mun or bgy).
    purpose: DepEd enrollment schools matched to PSGC cities and barangays, EMISD code first, then reviewed name matching (D-049).

gold_tables:
  - table: dim_school
    build_file: 01_build_dim_school.sql
    validate_file: 90_validate_dim_school.sql
    grain: One DepEd school.
  - table: dim_school_year
    build_file: 02_build_dim_school_year.sql
    validate_file: 90_validate_dim_school_year.sql
    grain: One enrollment school year.
  - table: dim_education_level
    build_file: 03_build_dim_education_level.sql
    validate_file: 90_validate_dim_education_level.sql
    grain: One education reporting level.
  - table: fact_school_classroom_capacity
    build_file: 11_build_fact_school_classroom_capacity.sql
    validate_file: 90_validate_fact_school_classroom_capacity.sql
    grain: One school and school year.
  - table: fact_school_teacher_capacity
    build_file: 12_build_fact_school_teacher_capacity.sql
    validate_file: 90_validate_fact_school_teacher_capacity.sql
    grain: One school, school year, and education level.
  - table: fact_school_year_source_availability
    build_file: 15_build_fact_school_year_source_availability.sql
    validate_file: 90_validate_fact_school_year_source_availability.sql
    grain: One school year and DepEd source.

gold_tables:
  - table: dim_city_municipality
    build_file: 04_build_dim_city_municipality.sql
    validate_file: 90_validate_dim_city_municipality.sql
    grain: One PSGC city or municipality of the master quarter, plus the UNKNOWN and EXCLUDED technical members.
  - table: dim_barangay
    build_file: 05_build_dim_barangay.sql
    validate_file: 90_validate_dim_barangay.sql
    grain: One PSGC barangay of the master quarter, one unknown barangay per city or municipality, plus the UNKNOWN and EXCLUDED technical members.
  - table: fact_city_school_age_population
    build_file: 14_build_fact_city_school_age_population.sql
    validate_file: 90_validate_fact_city_school_age_population.sql
    grain: One city or municipality, census year, single year of age, and sex (male or female).

deferred_layers:
  - analytics
