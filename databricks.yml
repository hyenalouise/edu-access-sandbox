        - task_key: 90_validate_deped_enrollment_psgc_raw
          depends_on:
            - task_key: bronze_deped_enrollment_psgc
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_deped_enrollment_psgc_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Source-lane fan-in: after every Silver gate has finished, passed or not, it records each
        # Silver lane that is switched on and fails if any did not succeed. Integration starts only
        # from it (D-039). Generated: python -m src.job.fan_in.
        - task_key: 90_validate_control
          depends_on:
            - task_key: 90_validate_deped_enrollment_clean
            - task_key: 90_validate_deped_facilities_clean
            - task_key: 90_validate_deped_personnel_clean
            - task_key: 90_validate_psa_psgc_clean
            - task_key: 90_validate_psa_poverty_stat_clean
            - task_key: 90_validate_hdx_adm3_clean
          run_if: ALL_DONE
          sql_task:
            file:
              path: etl/01_control/90_validate_control.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Source freshness, once the fan-in has finished, passed or not, so a run
        # that stopped at the fan-in still says which sources are stale. Records
        # WARN rows only, never fails (D-043). Generated by src/job/freshness.py.
        - task_key: 90_validate_freshness
          depends_on:
            - task_key: 90_validate_control
          run_if: ALL_DONE
          sql_task:
            file:
              path: etl/01_control/90_validate_freshness.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Integration maps fan out after their required clean source outputs.
        - task_key: 01_map_deped_school_psgc
          disabled: true
          depends_on:
            - task_key: 90_validate_control
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/01_map_deped_school_psgc.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_deped_school_psgc_map
