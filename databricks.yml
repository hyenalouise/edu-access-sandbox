# Databricks Asset Bundle for the Education Access Intelligence pipeline.
#
# This file deliberately shows the complete Source -> Bronze -> Silver ->
# Integration -> Gold -> Analytics DAG. Tasks whose implementation is still a
# placeholder stay in the graph with disabled: true and are enabled only after
# their contract, transform, and validation gate are implemented and reviewed.
#
# Change the job by changing this file and deploying, not by editing it in the
# workspace: a UI edit does not reach this file, and the next deploy overwrites it.
# Commands and checks: docs/operations/ingestion.md, "Running on Databricks".
bundle:
  name: edu-access-intelligence

variables:
  warehouse_id:
    description: SQL warehouse that runs the job's SQL tasks (Serverless Starter Warehouse)
    default: ba94770acbbc293c
  duration_warning_seconds:
    description: >-
      Email a run still going after this long (45 minutes). Observed whole runs took 6 min 43 s to
      18 min 22 s, and the first run 39 minutes, 35.5 of them waiting for Free Edition capacity (D-017).
    default: 2700
  job_timeout_seconds:
    description: Stop and fail a run still going after this long (90 minutes, twice the warning).
    default: 5400
  alert_schedule:
    description: >-
      When the SQL alerts evaluate (Quartz cron, Asia/Manila): daily at 08:00. Once a day keeps the
      warehouse idle otherwise; the job has no schedule, so a run's results wait at most a day.
    default: "0 0 8 * * ?"

resources:
  jobs:
    edu_access_pipeline:
      name: edu_access_pipeline
      description: >-
        Validates and ingests nine approved education and geography sources
        through Bronze; eight continue through Silver. Each Integration, Gold, and
        Analytics task starts from the gates it reads (D-051); placeholders stay
        visible but disabled.

      parameters:
        - name: code_revision
          default: ${bundle.git.commit}
        - name: run_id
          default: "{{job.run_id}}"
        - name: environment
          default: ${bundle.target}
        # Blank: check source freshness as of now. A UTC timestamp checks it as
        # of that time instead, which is how the stale-source alert is tested.
        - name: freshness_as_of
          default: ""

      git_source:
        git_url: https://github.com/reached-hq/edu-access-intelligence
        git_provider: gitHub
        git_commit: ${bundle.git.commit}

      max_concurrent_runs: 1
      queue:
        enabled: true

      # A failed or slow run emails whoever deployed the job, resolved at deploy
      # time, so no address is committed (D-043). A run that times out counts as
      # failed. The thresholds are variables so an alert can be tested with a
      # one-off --var override; their defaults come from observed runs (D-043).
      timeout_seconds: ${var.job_timeout_seconds}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: ${var.duration_warning_seconds}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        on_duration_warning_threshold_exceeded:
          - ${workspace.current_user.userName}
      notification_settings:
        no_alert_for_canceled_runs: true
        no_alert_for_skipped_runs: true

      tasks:
        # Shared control bootstrap. These idempotent DDL tasks run once before
        # the source lanes fan out, avoiding concurrent control-table creation.
        - task_key: 01_create_pipeline_runs
          sql_task:
            file:
              path: etl/01_control/01_create_pipeline_runs.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 02_create_ingestion_batches
          depends_on:
            - task_key: 01_create_pipeline_runs
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/02_create_ingestion_batches.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 03_create_ingestion_batch_attempts
          depends_on:
            - task_key: 02_create_ingestion_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/03_create_ingestion_batch_attempts.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 04_create_data_quality_results
          depends_on:
            - task_key: 03_create_ingestion_batch_attempts
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/04_create_data_quality_results.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # CREATE TABLE IF NOT EXISTS adds no column to an existing table, and
        # Databricks has no ADD COLUMN IF NOT EXISTS: columns added after a table
        # was first created (control.ADDED_COLUMNS) are added here, once, before
        # the view that reads them is replaced and before the lanes fan out.
        - task_key: add_control_columns
          depends_on:
            - task_key: 04_create_data_quality_results
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - columns
              - --backend
              - spark

        - task_key: 05_create_current_batches
          depends_on:
            - task_key: add_control_columns
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/05_create_current_batches.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 01 - DepEd enrollment
        - task_key: 01_create_deped_enrollment_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/01_create_deped_enrollment_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_deped_enrollment
          depends_on:
            - task_key: 01_create_deped_enrollment_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - deped_enrollment
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
              - "{{job.parameters.run_id}}"

        - task_key: 90_validate_deped_enrollment_raw
