            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_deped_enrollment_psgc
          depends_on:
            - task_key: 07_create_deped_enrollment_psgc_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - deped_enrollment_psgc
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
