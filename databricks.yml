# Databricks Asset Bundle for the Education Access Intelligence pipeline.
#
# This file deliberately shows the complete Source -> Bronze -> Silver ->
# Integration -> Gold -> Analytics DAG. Tasks whose implementation is still a
# placeholder stay in the graph with disabled: true and are enabled only after
# their contract, transform, and validation gate are implemented and reviewed.
#
# Change the job by changing this file and deploying, not by editing it in the
# workspace: a UI edit does not reach this file, and the next deploy overwrites it.
# Commands and checks: docs/operations/ingestion.md, "Running on Databricks".
bundle:
  name: edu-access-intelligence

variables:
  warehouse_id:
    description: SQL warehouse that runs the job's SQL tasks (Serverless Starter Warehouse)
    default: 71d3ccb9cea611c0

resources:
  jobs:
    edu_access_pipeline:
      name: edu_access_pipeline
      description: >-
        Validates and ingests six approved education and geography sources
        through Bronze. The unimplemented Silver, Integration, Gold, and
        Analytics tasks remain visible but disabled.

      parameters:
        - name: code_revision
          default: ${bundle.git.commit}
        - name: run_id
          default: "{{job.run_id}}"
        - name: environment
          default: ${bundle.target}

      git_source:
        git_url: https://github.com/reached-hq/edu-access-intelligence
        git_provider: gitHub
        git_commit: ${bundle.git.commit}

      max_concurrent_runs: 1
      queue:
        enabled: true

      tasks:
        # Shared control bootstrap. These idempotent DDL tasks run once before
        # the source lanes fan out, avoiding concurrent control-table creation.
        - task_key: 01_create_pipeline_runs
          sql_task:
            file:
              path: etl/01_control/01_create_pipeline_runs.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 02_create_ingestion_batches
          depends_on:
            - task_key: 01_create_pipeline_runs
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/02_create_ingestion_batches.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 03_create_ingestion_batch_attempts
          depends_on:
            - task_key: 02_create_ingestion_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/03_create_ingestion_batch_attempts.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 04_create_data_quality_results
          depends_on:
            - task_key: 03_create_ingestion_batch_attempts
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/04_create_data_quality_results.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # CREATE TABLE IF NOT EXISTS adds no column to an existing table, and
        # Databricks has no ADD COLUMN IF NOT EXISTS: columns added after a table
        # was first created (control.ADDED_COLUMNS) are added here, once, before
        # the view that reads them is replaced and before the lanes fan out.
        - task_key: add_control_columns
          depends_on:
            - task_key: 04_create_data_quality_results
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - columns
              - --backend
              - spark

        - task_key: 05_create_current_batches
          depends_on:
            - task_key: add_control_columns
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/01_control/05_create_current_batches.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 01 - DepEd enrollment
        - task_key: 01_create_deped_enrollment_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/01_create_deped_enrollment_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_deped_enrollment
          depends_on:
            - task_key: 01_create_deped_enrollment_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - deped_enrollment
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
              - "{{job.parameters.run_id}}"

        - task_key: 90_validate_deped_enrollment_raw
          depends_on:
            - task_key: bronze_deped_enrollment
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_deped_enrollment_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 01_clean_deped_enrollment
          depends_on:
            - task_key: 90_validate_deped_enrollment_raw
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/01_clean_deped_enrollment.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_deped_enrollment_clean
          depends_on:
            - task_key: 01_clean_deped_enrollment
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/90_validate_deped_enrollment_clean.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 02 - DepEd facilities
        - task_key: 02_create_deped_facilities_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/02_create_deped_facilities_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_deped_facilities
          depends_on:
            - task_key: 02_create_deped_facilities_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - deped_facilities
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
              - "{{job.parameters.run_id}}"

        - task_key: 90_validate_deped_facilities_raw
          depends_on:
            - task_key: bronze_deped_facilities
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_deped_facilities_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Reads the published enrollment Silver: a school missing there is quarantined (O-2, D-037).
        - task_key: 02_clean_deped_facilities
          depends_on:
            - task_key: 90_validate_deped_facilities_raw
            - task_key: 90_validate_deped_enrollment_clean
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/02_clean_deped_facilities.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_deped_facilities_clean
          depends_on:
            - task_key: 02_clean_deped_facilities
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/90_validate_deped_facilities_clean.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 03 - DepEd personnel
        - task_key: 03_create_deped_personnel_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/03_create_deped_personnel_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_deped_personnel
          depends_on:
            - task_key: 03_create_deped_personnel_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - deped_personnel
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
              - "{{job.parameters.run_id}}"

        - task_key: 90_validate_deped_personnel_raw
          depends_on:
            - task_key: bronze_deped_personnel
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_deped_personnel_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 03_clean_deped_personnel
          disabled: true
          depends_on:
            - task_key: 90_validate_deped_personnel_raw
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/03_clean_deped_personnel.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_deped_personnel_clean
          disabled: true
          depends_on:
            - task_key: 03_clean_deped_personnel
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/90_validate_deped_personnel_clean.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 04 - PSA PSGC workbook, PSGC sheet
        - task_key: 04_create_psa_psgc_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/04_create_psa_psgc_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_psa_psgc
          depends_on:
            - task_key: 04_create_psa_psgc_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - psa_psgc
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
              - "{{job.parameters.run_id}}"

        - task_key: 90_validate_psa_psgc_raw
          depends_on:
            - task_key: bronze_psa_psgc
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_psa_psgc_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 04_clean_psa_psgc
          disabled: true
          depends_on:
            - task_key: 90_validate_psa_psgc_raw
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/04_clean_psa_psgc.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_psa_psgc_clean
          disabled: true
          depends_on:
            - task_key: 04_clean_psa_psgc
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/90_validate_psa_psgc_clean.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 05 - PSA poverty statistics
        - task_key: 05_create_psa_poverty_stat_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/05_create_psa_poverty_stat_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_psa_poverty_stat
          depends_on:
            - task_key: 05_create_psa_poverty_stat_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - psa_poverty_stat
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
              - "{{job.parameters.run_id}}"

        - task_key: 90_validate_psa_poverty_stat_raw
          depends_on:
            - task_key: bronze_psa_poverty_stat
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_psa_poverty_stat_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 05_clean_psa_poverty_stat
          depends_on:
            - task_key: 90_validate_psa_poverty_stat_raw
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/05_clean_psa_poverty_stat.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_psa_poverty_stat_clean
          depends_on:
            - task_key: 05_clean_psa_poverty_stat
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/90_validate_psa_poverty_stat_clean.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 06 - HDX ADM3 boundaries
        - task_key: 06_create_hdx_adm3_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/06_create_hdx_adm3_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_hdx_boundaries
          depends_on:
            - task_key: 06_create_hdx_adm3_raw
          run_if: ALL_SUCCESS
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --no-setup
              - --backend
              - spark
              - --source
              - hdx_boundaries
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"
              - --job-run-id
              - "{{job.parameters.run_id}}"

        - task_key: 90_validate_hdx_adm3_raw
          depends_on:
            - task_key: bronze_hdx_boundaries
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_hdx_adm3_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 06_clean_hdx_adm3
          disabled: true
          depends_on:
            - task_key: 90_validate_hdx_adm3_raw
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/06_clean_hdx_adm3.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_hdx_adm3_clean
          disabled: true
          depends_on:
            - task_key: 06_clean_hdx_adm3
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/90_validate_hdx_adm3_clean.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Control reconciliation after every source lane has reached a terminal state.
        - task_key: 90_validate_control
          disabled: true
          depends_on:
            - task_key: 90_validate_deped_enrollment_clean
            - task_key: 90_validate_deped_facilities_clean
            - task_key: 90_validate_deped_personnel_clean
            - task_key: 90_validate_psa_psgc_clean
            - task_key: 90_validate_psa_poverty_stat_clean
            - task_key: 90_validate_hdx_adm3_clean
          run_if: ALL_DONE
          sql_task:
            file:
              path: etl/01_control/90_validate_control.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Integration maps fan out after their required clean source outputs.
        - task_key: 01_map_deped_school_psgc
          disabled: true
          depends_on:
            - task_key: 90_validate_control
            - task_key: 90_validate_deped_enrollment_clean
            - task_key: 90_validate_deped_facilities_clean
            - task_key: 90_validate_deped_personnel_clean
            - task_key: 90_validate_psa_psgc_clean
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/01_map_deped_school_psgc.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_deped_school_psgc_map
          disabled: true
          depends_on:
            - task_key: 01_map_deped_school_psgc
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_deped_school_psgc_map.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 02_map_psa_poverty_psgc
          disabled: true
          depends_on:
            - task_key: 90_validate_control
            - task_key: 90_validate_psa_poverty_stat_clean
            - task_key: 90_validate_psa_psgc_clean
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/02_map_psa_poverty_psgc.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_psa_poverty_psgc_map
          disabled: true
          depends_on:
            - task_key: 02_map_psa_poverty_psgc
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_psa_poverty_psgc_map.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 03_map_hdx_adm3_psgc
          disabled: true
          depends_on:
            - task_key: 90_validate_control
            - task_key: 90_validate_hdx_adm3_clean
            - task_key: 90_validate_psa_psgc_clean
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/03_map_hdx_adm3_psgc.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_hdx_adm3_psgc_map
          disabled: true
          depends_on:
            - task_key: 03_map_hdx_adm3_psgc
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_hdx_adm3_psgc_map.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Integrated education and geography outputs.
        - task_key: 10_integrate_deped_school_year
          disabled: true
          depends_on:
            - task_key: 90_validate_deped_school_psgc_map
            - task_key: 90_validate_psa_poverty_psgc_map
            - task_key: 90_validate_hdx_adm3_psgc_map
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/10_integrate_deped_school_year.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_deped_school_year_integrated
          disabled: true
          depends_on:
            - task_key: 10_integrate_deped_school_year
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_deped_school_year_integrated.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 20_integrate_education_geography
          disabled: true
          depends_on:
            - task_key: 90_validate_deped_school_year_integrated
            - task_key: 90_validate_psa_poverty_psgc_map
            - task_key: 90_validate_hdx_adm3_psgc_map
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/20_integrate_education_geography.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_education_geography_integrated
          disabled: true
          depends_on:
            - task_key: 20_integrate_education_geography
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_education_geography_integrated.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Gold dimensions and facts.
        - task_key: 01_placeholder_dim_geography
          disabled: true
          depends_on:
            - task_key: 90_validate_education_geography_integrated
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/05_gold/01_placeholder_dim_geography.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_placeholder_validate_dim_geography
          disabled: true
          depends_on:
            - task_key: 01_placeholder_dim_geography
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/05_gold/90_placeholder_validate_dim_geography.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 02_placeholder_dim_school
          disabled: true
          depends_on:
            - task_key: 90_validate_education_geography_integrated
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/05_gold/02_placeholder_dim_school.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_placeholder_validate_dim_school
          disabled: true
          depends_on:
            - task_key: 02_placeholder_dim_school
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/05_gold/90_placeholder_validate_dim_school.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 10_placeholder_fact_school_year
          disabled: true
          depends_on:
            - task_key: 90_placeholder_validate_dim_geography
            - task_key: 90_placeholder_validate_dim_school
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/05_gold/10_placeholder_fact_school_year.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_placeholder_validate_fact_school_year
          disabled: true
          depends_on:
            - task_key: 10_placeholder_fact_school_year
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/05_gold/90_placeholder_validate_fact_school_year.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 20_placeholder_fact_poverty_estimate
          disabled: true
          depends_on:
            - task_key: 90_placeholder_validate_dim_geography
            - task_key: 90_placeholder_validate_dim_school
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/05_gold/20_placeholder_fact_poverty_estimate.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_placeholder_validate_fact_poverty_estimate
          disabled: true
          depends_on:
            - task_key: 20_placeholder_fact_poverty_estimate
          run_if: ALL_SUCCESS
          sql_task:
            file:
