        - task_key: 90_validate_hdx_adm3_raw
          depends_on:
            - task_key: bronze_hdx_boundaries
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_hdx_adm3_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 06_clean_hdx_adm3
          depends_on:
            - task_key: 90_validate_hdx_adm3_raw
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/06_clean_hdx_adm3.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_hdx_adm3_clean
          depends_on:
            - task_key: 06_clean_hdx_adm3
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/03_silver/90_validate_hdx_adm3_clean.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # 07 - DepEd EMISD enrollment with PSGC and coordinates (Bronze only until its Silver issue)
        - task_key: 07_create_deped_enrollment_psgc_raw
          depends_on:
            - task_key: 05_create_current_batches
          run_if: ALL_SUCCESS
          sql_task:
            file:
