        - task_key: 90_validate_deped_annex_mother_map
          depends_on:
            - task_key: 04_map_deped_annex_mother
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_deped_annex_mother_map.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Integrated education and geography outputs.
        - task_key: 10_integrate_deped_school_year
          disabled: true
          depends_on:
            - task_key: 90_validate_deped_school_psgc_map
            - task_key: 90_validate_psa_poverty_psgc_map
            - task_key: 90_validate_hdx_adm3_psgc_map
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/10_integrate_deped_school_year.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_deped_school_year_integrated
          disabled: true
          depends_on:
            - task_key: 10_integrate_deped_school_year
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_deped_school_year_integrated.sql
