          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_psa_poverty_psgc_map.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 03_map_hdx_adm3_psgc
          disabled: true
          depends_on:
            - task_key: 90_validate_control
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/03_map_hdx_adm3_psgc.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 90_validate_hdx_adm3_psgc_map
          disabled: true
          depends_on:
            - task_key: 03_map_hdx_adm3_psgc
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/90_validate_hdx_adm3_psgc_map.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        - task_key: 04_map_deped_annex_mother
          depends_on:
            - task_key: 90_validate_control
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/04_integration/04_map_deped_annex_mother.sql
