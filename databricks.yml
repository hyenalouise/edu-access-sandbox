            file:
              path: etl/01_control/90_validate_control.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # Source freshness, once the fan-in has finished, passed or not, so a run that failed at the
        # fan-in still says which sources are stale. The fan-in waits for every Silver gate, and Databricks
