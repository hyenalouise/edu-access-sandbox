  # SQL alerts on the control tables, so a FAIL or a stale source is visible
  # without opening the job's logs: the alert email lists the rows (D-043).
  # Each evaluates once a day. Like the job, they email whoever deployed.
  # Each query counts its own rows (COUNT(*) OVER ()) and the alert compares
  # that column on the first row: an aggregation in the alert would make the
  # email show only the count, not the rows (seen on dev, 2026-10-13).
  # Each check's newest result in a run decides (RANK, so the rows one gate
  # wrote together stay together): a gate rerun in a repaired run, which keeps
  # its run_id, replaces its earlier FAIL. Tested on DuckDB in tests/test_alerts.py.
  alerts:
    quality_failures:
      display_name: edu_access_pipeline data-quality FAIL
      warehouse_id: ${var.warehouse_id}
      query_text: |-
        WITH latest_run AS (
          SELECT run_id FROM edu_access.`01-control`.data_quality_results
          ORDER BY checked_at_utc DESC LIMIT 1
        ),
        newest AS (
          SELECT q.*, RANK() OVER (
                   PARTITION BY q.layer, q.source_id, q.batch_id, q.table_name, q.check_name
                   ORDER BY q.checked_at_utc DESC) AS result_rank
          FROM edu_access.`01-control`.data_quality_results AS q
          JOIN latest_run AS r ON q.run_id = r.run_id
        )
        SELECT COUNT(*) OVER () AS fail_count,
               run_id, layer, source_id, table_name, check_name, expected, actual, checked_at_utc
        FROM newest
        WHERE result_rank = 1 AND status = 'FAIL'
        ORDER BY layer, source_id, table_name, check_name
      custom_summary: "edu_access_pipeline: {{ALERT_STATUS}}, data-quality FAIL in the latest run"
      custom_description: |-
        The latest run of edu_access_pipeline recorded these data-quality FAILs (newest result per check):

        {{QUERY_RESULT_TABLE}}

        Alert: {{ALERT_URL}}
      evaluation:
        source:
          name: fail_count
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        quartz_cron_schedule: ${var.alert_schedule}
        timezone_id: Asia/Manila
      permissions:
        - group_name: reached-hq
          level: CAN_RUN

    stale_sources:
      display_name: edu_access_pipeline stale source
      warehouse_id: ${var.warehouse_id}
      # The latest run that checked freshness, so a partial run that skipped
      # the check does not hide a stale source.
      query_text: |-
        WITH latest_run AS (
          SELECT run_id FROM edu_access.`01-control`.data_quality_results
          WHERE check_name = 'source_fresh'
          ORDER BY checked_at_utc DESC LIMIT 1
        ),
        newest AS (
          SELECT q.*, RANK() OVER (PARTITION BY q.source_id ORDER BY q.checked_at_utc DESC) AS result_rank
          FROM edu_access.`01-control`.data_quality_results AS q
          JOIN latest_run AS r ON q.run_id = r.run_id
          WHERE q.check_name = 'source_fresh'
        )
        SELECT COUNT(*) OVER () AS stale_count, run_id, source_id, expected, actual, checked_at_utc
        FROM newest
        WHERE result_rank = 1 AND status = 'WARN'
        ORDER BY source_id
      custom_summary: "edu_access_pipeline: {{ALERT_STATUS}}, a source may be stale"
      custom_description: |-
        These sources' latest succeeded batch is older than its limit in config/freshness.yml, or they have no succeeded batch yet. For an old batch, check the publisher for a newer release; for no batch, check that the source was loaded:

        {{QUERY_RESULT_TABLE}}

        Alert: {{ALERT_URL}}
      evaluation:
        source:
          name: stale_count
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        quartz_cron_schedule: ${var.alert_schedule}
        timezone_id: Asia/Manila
      permissions:
        - group_name: reached-hq
          level: CAN_RUN

