name: CI

# Runs on every pull request, whatever branch it targets (so stacked pull requests
# are checked too), and on every push to main. Only checks on pull requests into
# main block merging (branch protection).
#
# Only the bundle check holds a Databricks token, and it can only validate: CI
# proves the repository and code behave correctly. Whether the real data is
# correct is checked by the DQ steps inside Databricks.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, milestoned, demilestoned]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests and policy checks
        run: python -m pytest tests -q

  # Validates databricks.yml against this branch's files on the dev workspace, so
  # a missing or renamed file is caught before merge, not by the prod deploy.
  # Uses the "ci-validate" environment, never "production": a pull request can
  # change this workflow, so its token must only be able to validate.
  # Skipped for pull requests from forks, which cannot read environment secrets.
  # deployment: false reads the environment without recording a deployment, so
  # pull requests do not show ci-validate as deployed.
  bundle-validate:
    name: Databricks bundle validates
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ci-validate
      deployment: false
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the environment is set
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::Missing environment variable DATABRICKS_HOST (Settings -> Environments -> ci-validate)."
            exit 1
          fi
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::Missing environment secret DATABRICKS_TOKEN (Settings -> Environments -> ci-validate)."
            exit 1
          fi

      - name: Install Databricks CLI
        uses: databricks/setup-cli@d76f84cea9893ce68311a1f33fb0c95af6c963b7 # v1.17.0
        with:
          version: 1.17.0

      - name: Validate the bundle
        run: databricks bundle validate --target dev

  pr-description:
    name: PR links an issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Read access to see which issues merging will close, including sidebar links.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Check the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(closes|fixes|resolves|part of|related to) #[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Add the issue to the PR description, e.g. 'Closes #24' or 'Part of #49'."
            exit 1
          fi

      # A typo'd number fails; a closed issue only warns ('Related to' one is fine).
      - name: Check the linked issues exist and are open
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUES=$(for n in $(python3 .github/scripts/linked_issues.py); do
            if issue=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" \
                --jq '{number, state, is_pull_request: (.pull_request != null)}' 2>/dev/null); then
              echo "$issue"
            else
              echo "{\"number\": $n, \"missing\": true}"
            fi
          done | jq -s .)
          export ISSUES
          python3 .github/scripts/linked_issue_states.py

      # A sidebar link (Development) closes an issue just like 'Closes', and adding
      # one triggers no event: rerun this check after changing the sidebar.
      - name: Check which issues merging will close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CLOSING=$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) { pullRequest(number: $number) {
                closingIssuesReferences(first: 50) { nodes { number title subIssuesSummary { total } } } } } }' \
            -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F number="$NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes')
          export CLOSING
          python3 .github/scripts/closing_issues.py

  ai-help:
    name: PR declares AI help
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Check the AI help section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/pr_ai_help.py

  milestone:
    name: PR has a milestone
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Write access only to copy a milestone from the linked issue onto the PR.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Check the milestone, copying it from the linked issue if missing
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Read the milestone fresh: it may have been set after this run started.
          current=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.milestone.title // empty')
          if [ -n "$current" ]; then
            echo "Milestone: $current"
            exit 0
          fi
          for issue in $(python3 .github/scripts/linked_issues.py); do
            milestone=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.milestone.number // empty' 2>/dev/null || true)
            if [ -n "$milestone" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$NUMBER" -F "milestone=$milestone" --silent
              echo "Copied the milestone from #$issue."
              exit 0
            fi
          done
          echo "::error::Set a milestone on this PR (sidebar, Milestone). The linked issue has none to copy, so give the issue one too."
          exit 1
